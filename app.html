<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>發糕日誌</title>
<link rel="stylesheet" href="https://mashin-84.github.io/fagao/app.css?v=1795830269">
</head>
<body>
<div id="app"><div id="boot" style="padding:20px;color:#8a8178;font-size:14px">載入中…（v7）</div></div>
<script>
window.addEventListener('error',e=>{try{const d=document.getElementById('app');if(d&&!d.dataset.err){d.dataset.err=1;d.innerHTML=('<div style="background:#c0392b;color:#fff;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:13px;word-break:break-all">畫面出錯了，請截圖給 Claude：<br>'+String(e.message).replace(/</g,'&lt;')+' (line '+e.lineno+')</div>')}}catch(_){}});
</script>
<div class="bar" id="bar">
  <button class="b-feed" data-open="feed"><span>🍼</span>喝奶</button>
  <button class="b-pee" data-open="pee"><span>💧</span>尿尿</button>
  <button class="b-poop" data-open="poop"><span>💩</span>大便</button>
  <button class="b-other" data-open="other"><span>➕</span>其他</button>
</div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script crossorigin="anonymous" src="https://mashin-84.github.io/fagao/app.js?v=1795830269"></script>
</body>
</html>
